# Typecheck, test, build.
#
# `npm test` is Node's own runner over the TypeScript sources with no build
# step, which needs type stripping -- asked for explicitly with
# `--experimental-strip-types`, so the suite also runs on the Node 22 releases
# before 22.18, where stripping is not yet on by default. That is why the matrix
# starts at 22 rather than at the 20.6 in `engines`: 20.6 is what the
# *published* package needs, since consumers install compiled JavaScript from
# dist/ and have no TypeScript to strip.
#
# The `build-runs-on-node-20` job below is the check that keeps those two
# numbers honest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build-runs-on-node-20:
    # `engines` promises Node 20.6. Nothing else in this workflow would notice
    # if the compiled output stopped running there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Three invocations that could not fail, made into three that can.
      #
      # `--version` exits 0 whatever happens: `readVersion()` catches
      # everything and answers '0.0.0', so a dist/ layout change that breaks
      # `new URL('../package.json', import.meta.url)` printed a number and
      # passed. `--explain` had its output sent to /dev/null, so an empty
      # description table passed. And `clean.md` exits 0 because the tool finds
      # NOTHING in it -- which a checkIssue stubbed to report no gaps also
      # does, so the one fixture here was the one that a stub survives.
      - name: the CLI runs on the oldest Node engines claims
        run: |
          set -euo pipefail
          version=$(node dist/bin.js --version)
          echo "version $version"
          test "$version" != "0.0.0"
          test "$version" = "$(node -p 'require("./package.json").version')"
          # Every category the tool can report is described, not merely exit 0.
          node dist/bin.js --explain | tee /tmp/explain.txt
          test "$(grep -c '^[a-z-]\+$' /tmp/explain.txt)" = "10"
          # A report with nothing wrong, and a report with something wrong.
          node dist/bin.js --no-color test/fixtures/clean.md
          if node dist/bin.js --no-color test/fixtures/vague.md; then
            echo "vague.md was reported clean, so this step proved nothing"
            exit 1
          fi
